# Production stack for the Jdiobe STEM backend.
#
# This host is shared with several unrelated services, so nothing here binds a
# port another stack already holds, and Postgres is not published to the host at
# all — it is reachable only on this compose project's private network.
#
# TLS terminates in the bundled nginx rather than the host's system nginx, which
# other people's sites depend on and which this stack must not edit.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

name: jdiobestem

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately no `ports:` — the database is not reachable from the host
    # network or the internet, only from the `web` container beside it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # One flat line per shell command: in a folded YAML scalar, a line
    # indented deeper than the first keeps its newline instead of folding,
    # which silently drops trailing flags off the gunicorn invocation.
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -"
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    # Also unpublished: the only way in is through the proxy below.
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # The provider exposes only 22, 80 and 443 to the internet; 80 belongs to
      # the host's own nginx, so 443 is the one door available to this stack.
      - "443:443"
    volumes:
      - ./nginx/jdiobestem.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web

volumes:
  pgdata:
