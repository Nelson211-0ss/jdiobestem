# One TLS front door, serving the API and nothing else.
#
# The Django admin is not used by this organisation — the Next.js dashboard is
# the only admin UI — so the hostname that would reach it is refused here and
# is absent from DJANGO_ALLOWED_HOSTS as well. Closing it at both layers means
# no login form is exposed for a UI nobody signs into.
#
# `admin.` is left reserved rather than reused: when the Next.js dashboard is
# deployed it belongs on that name, and the certificate already covers it.

upstream django {
    server web:8000;
}

# Anything on an admin.* host is dropped without a response and never reaches
# the application. 444 closes the connection instead of describing the service.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.147-224-178-246.nip.io admin.147.224.178.246;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 444;
}

# ---- API ----------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Uploads: the API caps these server-side too (UPLOAD_MAX_BYTES).
    client_max_body_size 20m;

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
